name: AppSpace - Android APK + Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "configuracoes.html"
      - "assets/**"
      - "apps/**"
      - "package.json"
      - "capacitor.config.json"
      - "desktop/**"
      - "scripts/**"
      - "native/**"
      - ".github/workflows/appspace-build.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validar portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar páginas e assets
        run: npm run check

  drawer-ui:
    name: Testar gavetas no Chromium
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador de teste isolado
        run: |
          npm install --prefix "$RUNNER_TEMP/appspace-browser" playwright@1.62.1 --no-audit --no-fund
          "$RUNNER_TEMP/appspace-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Testar tamanhos, temas, busca e navegação offline
        run: NODE_PATH="$RUNNER_TEMP/appspace-browser/node_modules" node scripts/test-drawer-browser.cjs
      - name: Salvar capturas e resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppSpace-Drawer-UI
          path: dist/ui-check/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Compilar APK Android
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependências
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Gerar plataforma Android isolada
        run: npm run mobile:add
      - name: Gerar APK de depuração
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Validar assinatura de release com chave EFÊMERA de teste (não publicar)
        run: |
          umask 077
          export APPSPACE_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/appspace-ci-only.jks"
          export APPSPACE_RELEASE_STORE_PASSWORD="$(openssl rand -hex 18)"
          export APPSPACE_RELEASE_KEY_ALIAS="appspace-ci"
          export APPSPACE_RELEASE_KEY_PASSWORD="$APPSPACE_RELEASE_STORE_PASSWORD"
          keytool -genkeypair -noprompt -keystore "$APPSPACE_RELEASE_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$APPSPACE_RELEASE_STORE_PASSWORD" -keypass "$APPSPACE_RELEASE_KEY_PASSWORD" \
            -alias "$APPSPACE_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=AppSpace CI Only"
          node scripts/prepare-release-signing.cjs
          cd mobile/android
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cd ../..
          rm -f "$APPSPACE_RELEASE_KEYSTORE_PATH"
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AppSpace-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Compilar executável Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar e consultar adaptador Windows sem alterar configurações
        shell: pwsh
        run: |
          $raw = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File desktop/pc-controls.ps1 -Operation read
          if ($LASTEXITCODE -ne 0) { throw "O adaptador de controles Windows falhou" }
          $state = $raw | ConvertFrom-Json
          if ($state.scope -ne "windows-defaults") { throw "O adaptador retornou estado inválido" }
      - name: Gerar executável portátil
        run: npm run desktop:exe
      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: AppSpace-Windows-EXE
          path: dist/electron/*.exe
          if-no-files-found: error
          retention-days: 14

