name: AppSpace - Publicar Android APK direto
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/android-release-request.json"
permissions:
  contents: write
concurrency:
  group: appspace-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Preparar SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verificar código e modelo de etiquetas
        run: npm run check
      - name: Instalar dependências
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Gerar APK com seletor nativo de impressoras
        run: npm run mobile:add
      - name: Compilar APK Android
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./native/android-release-request.json").version')"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_NOTES="$(node -p 'require("./native/android-release-request.json").notes')"
          if [ "$VERSION" != "$PKG_VERSION" ] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão de release não corresponde a package.json"
            exit 1
          fi
          FILE="AppSpace-Android-$VERSION.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$FILE"
          unzip -t "$FILE" | tail -n 2
          if gh release view "appspace-android-v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release Android v$VERSION já existe."
            exit 1
          fi
          gh release create "appspace-android-v$VERSION" "$FILE" \
            --title "AppSpace Android $VERSION — PC Monitor horizontal" \
            --notes "$RELEASE_NOTES. Build DEBUG: pode haver conflito de assinatura com versões anteriores. Salve seus projetos JSON e listas fora do aplicativo antes de desinstalar." \
            --target "$GITHUB_SHA"
      - name: Exibir link
        run: echo "APK → https://github.com/${GITHUB_REPOSITORY}/releases/tag/appspace-android-v$(node -p 'require("./package.json").version')" >> "$GITHUB_STEP_SUMMARY"
