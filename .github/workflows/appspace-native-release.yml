name: AppSpace - Publicar Android APK assinado
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/android-release-request.json"
permissions:
  contents: write
concurrency:
  group: appspace-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Validar versão solicitada e evitar release duplicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./native/android-release-request.json").version')"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$PKG_VERSION" ] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão de release inválida ou diferente de package.json."
            exit 1
          fi
          if gh release view "appspace-android-v$VERSION" >/dev/null 2>&1; then
            echo "::error::O release Android v$VERSION já existe."
            exit 1
          fi
      - name: Verificar assinatura estável configurada
        env:
          KEYSTORE_BASE64: ${{ secrets.APPSPACE_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.APPSPACE_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APPSPACE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APPSPACE_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release bloqueado: configure os quatro Secrets APPSPACE_ANDROID_* para assinar com uma chave persistente. Nunca publique assembleDebug como atualização."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/appspace-release.jks"
          test -s "$RUNNER_TEMP/appspace-release.jks"
          echo "APPSPACE_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/appspace-release.jks" >> "$GITHUB_ENV"
      - name: Preparar Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verificar código e testes
        run: npm run check
      - name: Instalar dependências
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Preparar APK Android com plugins nativos
        run: npm run mobile:add
      - name: Aplicar assinatura de release e compilar
        env:
          APPSPACE_RELEASE_STORE_PASSWORD: ${{ secrets.APPSPACE_ANDROID_STORE_PASSWORD }}
          APPSPACE_RELEASE_KEY_ALIAS: ${{ secrets.APPSPACE_ANDROID_KEY_ALIAS }}
          APPSPACE_RELEASE_KEY_PASSWORD: ${{ secrets.APPSPACE_ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/prepare-release-signing.cjs
          chmod +x mobile/android/gradlew
          cd mobile/android
          ./gradlew assembleRelease --no-daemon
      - name: Validar APK assinado e publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./native/android-release-request.json").version')"
          FILE="AppSpace-Android-$VERSION.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$FILE"
          unzip -t "$FILE" | tail -n 2
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$FILE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$FILE" | grep "versionName='$VERSION'"
          RELEASE_NOTES="$(node -p 'require("./native/android-release-request.json").notes')"
          gh release create "appspace-android-v$VERSION" "$FILE" \
            --title "AppSpace Android $VERSION — Etiqueta Studio e integração nativa" \
            --notes "$RELEASE_NOTES. APK de release assinado com chave persistente. A atualização sobre versões debug antigas poderá exigir backup dos dados e reinstalação." \
            --target "$GITHUB_SHA"
      - name: Limpar keystore temporário
        if: always()
        run: rm -f "$RUNNER_TEMP/appspace-release.jks"
      - name: Sumário
        if: success()
        run: echo "APK assinado → https://github.com/${GITHUB_REPOSITORY}/releases/tag/appspace-android-v$(node -p 'require("./package.json").version')" >> "$GITHUB_STEP_SUMMARY"
